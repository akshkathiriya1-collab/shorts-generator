<!DOCTYPE html>
<html>
<head>
  <title>Shorts Generator</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: white; }
    textarea { width: 90%; height: 100px; font-size: 18px; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
    canvas { display: none; }
  </style>
</head>
<body>

<h1>🎬 Shorts Generator</h1>

<textarea id="text" placeholder="Enter your short text..."></textarea><br><br>
<button onclick="generate()">Generate Video</button>

<canvas id="canvas" width="1080" height="1920"></canvas>

<script>
async function generate() {
  const text = document.getElementById("text").value.toUpperCase();
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream);
  const chunks = [];

  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: "video/mp4" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "short.mp4";
    a.click();
  };

  recorder.start();

  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, 1080, 1920);
  ctx.fillStyle = "white";
  ctx.font = "bold 80px Arial";
  ctx.textAlign = "center";
  ctx.fillText(text, 540, 960);

  setTimeout(() => recorder.stop(), 6000);
}
</script>

</body>
</html>
